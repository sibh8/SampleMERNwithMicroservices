# eksctl cluster definition for the MERN stack.
# Create with:  eksctl create cluster -f eks/cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: mern-eks-cluster
  region: ap-south-1
  # Must be a currently-supported EKS version (1.31-1.37 as of late 2026).
  version: "1.33"
  tags:
    project: mern-microservices
    environment: dev

# OIDC is required for IAM Roles for Service Accounts (IRSA),
# used by the AWS Load Balancer Controller and CloudWatch agent.
iam:
  withOIDC: true

managedNodeGroups:
  - name: mern-ng
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20
    privateNetworking: false
    labels:
      role: worker
    tags:
      nodegroup: mern-ng
    iam:
      withAddonPolicies:
        # Allow nodes to pull from ECR, publish CloudWatch metrics/logs,
        # autoscale, and manage ALBs.
        imageBuilder: true
        cloudWatch: true
        autoScaler: true
        albIngress: true

# Managed add-ons kept current by EKS.
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver

# Ship control-plane logs to CloudWatch.
cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]
